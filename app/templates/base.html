<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#EFF1EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121714" media="(prefers-color-scheme: dark)">
  <title>{{ title|default('天气查询') }}</title>
  <meta name="description" content="打开就知道你在哪、那儿什么天气。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='6.5' fill='%23C9781A'/></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body{% if accent %} style="--accent: {{ accent }}"{% endif %}>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="colophon">
    <span>数据来源 {{ source_label|default('公开气象数据') }} · IP 定位到城市级</span>
    <span class="colophon__v">v{{ version|default('1.0.0') }}</span>
  </footer>
  <script>
    // 渐进增强：把 GET 表单提交改成等价的 location 跳转。
    // 页面本身无需 JS —— 没有 JS 时浏览器原生提交，行为完全一样。
    // 这里兜的是一类内嵌预览容器（如 IDE 内置浏览器）：它们给每个页面
    // 注入 Vite HMR 引导，但本站不是 Vite 服务，导致「表单提交」触发的
    // 整页导航一直停在加载状态；普通链接式跳转不受影响，故统一成跳转。
    document.addEventListener("submit", function (event) {
      var form = event.target;
      if (!form || (form.method || "get").toLowerCase() !== "get") return;
      var action = form.getAttribute("action");
      if (!action) return;
      event.preventDefault();
      var query = new URLSearchParams(new FormData(form)).toString();
      location.href = action + (query ? "?" + query : "");
    });
  </script>
</body>
</html>
